[project]
name = "links-pipeline"
version = "1.1.0"
description = "URL → scrape → LLM extraction → essays → platform → Markdown/HTML → images"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.12.2",
    "requests==2.31.0",
    "openai==1.6.0",
    "python-dotenv==1.0.0",
    "tqdm==4.66.1",
    "pyyaml==6.0.1",
    "colorama==0.4.6",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
markers = [
    "live_openai: exercises OpenAI API (requires OPENAI_API_KEY and network)",
]
addopts = "-m \"not live_openai\""
testpaths = ["tests"]
