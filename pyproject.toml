[project]
name = "links-pipeline"
version = "1.1.0"
description = "URL → scrape → LLM extraction → essays → platform → Markdown/HTML → images"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4==4.15.0",
    "requests==2.34.2",
    "openai==1.109.1",
    "python-dotenv==1.2.4",
    "tqdm==4.70.1",
    "pyyaml==6.0.3",
    "colorama==0.4.6",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
]

[tool.pytest.ini_options]
markers = [
    "live_openai: exercises OpenAI API (requires OPENAI_API_KEY and network)",
]
addopts = "-m \"not live_openai\""
testpaths = ["tests"]
